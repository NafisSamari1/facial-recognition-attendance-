services:
  - type: web
    name: verascan
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verascan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false

databases:
  - name: verascan-db
    databaseName: verascan
    user: verascan
